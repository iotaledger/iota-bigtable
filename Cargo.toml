[package]
name = "iota-bigtable"
version = "0.1.2"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
arc-swap = "1"
backoff = { version = "0.4.0", features = ["futures", "tokio"] }
bytes = "1"
gcp_auth = "0.12.5"
http = "1"
http-body = "1"
prometheus = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
serde = { version = "1.0.144", features = ["derive"] }
thiserror = "2.0.12"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"

[features]
# Generates the BigTable gRPC server code, needed only by the test mock server.
test-server = []

[dev-dependencies]
# Enables the test-server feature for `cargo test` without affecting normal builds.
iota-bigtable = { path = ".", features = ["test-server"] }
tokio = { version = "1", features = ["macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = { version = "0.14" }
